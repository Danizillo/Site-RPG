<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas de RPG (local)</title>
<style>
:root{--bg:#f4f4f4;--sf:#fff;--bd:#aaa;--tx:#1a1a1a;--mut:#666;--tab:#d9d9d9;--pv:#c0392b;--en:#2980b9;--bad:#ffdddd;--ok:#ddffdd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--sf:#26262a;--bd:#555;--tx:#eee;--mut:#aaa;--tab:#333;--bad:#5a2a2a;--ok:#244a2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1b1d;--sf:#26262a;--bd:#555;--tx:#eee;--mut:#aaa;--tab:#333;--bad:#5a2a2a;--ok:#244a2e;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{height:100%;background:var(--bg);color:var(--tx)}
body{display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:5px}
button{cursor:pointer;padding:5px 10px;font-weight:600}
#topo{display:flex;align-items:flex-end;gap:4px;padding:6px 8px 0;background:var(--tab);border-bottom:1px solid var(--bd);overflow-x:auto}
#abas{display:flex;gap:2px}
.aba{border-radius:8px 8px 0 0;border-bottom:none;background:var(--bg);opacity:.7;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.aba.on{opacity:1;background:var(--sf);border-bottom:2px solid var(--sf)}
.acao{border-radius:8px 8px 0 0;border-bottom:none}
#aviso{background:#c0392b;color:#fff;padding:5px 10px;font-size:13px}
#vazio{margin:auto;color:var(--mut)}
main{flex:1;display:flex;min-height:0}
.ficha{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.cab{display:flex;gap:6px}
.nome{flex:1;font-size:22px;font-weight:700;padding:6px 10px}
.bloco{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;max-width:340px}
.lin{display:flex;align-items:center;gap:8px;margin:6px 0}
.lin input[type=number]{width:60px;padding:2px;font-size:12px}
.barra{flex:1;height:15px;background:var(--tab);border:1px solid var(--bd);position:relative;border-radius:4px}
.fill{height:100%;width:100%;transition:width .3s;border-radius:3px}
.pv .fill{background:var(--pv)}.en .fill{background:var(--en)}
.txt{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:700;line-height:13px;color:#fff;text-shadow:0 0 3px #000}
.exc{position:absolute;top:-24px;left:50%;transform:translateX(-50%);color:#e00;font-weight:700;font-size:22px;display:none}
.bts{display:flex;gap:4px;margin-top:4px}
.bts button{flex:1;font-size:11px;padding:2px 4px}
.bts .dano{background:var(--bad)}.bts .cura{background:var(--ok)}
.anim-dano{animation:tremer .2s}.anim-cura{animation:brilhar .4s}
.zero{animation:piscar .5s infinite alternate}
@keyframes tremer{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes brilhar{50%{box-shadow:0 0 10px #2ecc71}}
@keyframes piscar{to{opacity:.4}}
.lado{width:300px;border-left:3px solid var(--bd);padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.img{aspect-ratio:1;background:var(--sf);border:1px dashed var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut);overflow:hidden}
.img img{max-width:100%;max-height:100%;object-fit:contain}
.dois{display:flex;gap:6px}.dois button{flex:1}
.dois .sel{outline:2px solid var(--en)}
textarea{flex:1;min-height:120px;padding:8px;resize:vertical}
#cfg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:5}
#cfg .caixa{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px;width:min(360px,92vw)}
#cfg h3{margin-bottom:8px}
#cfg .lin span{width:60px}
[hidden]{display:none!important}
.par{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;max-width:700px}
.par .bloco{flex:1 1 220px;min-width:220px;max-width:340px}
.poder .topo{display:flex;gap:4px;margin-bottom:4px}
.poder .topo input{margin:0}
.poder .topo [data-f=n]{flex:5;min-width:0}
.poder .topo [data-f=v]{flex:1;min-width:0;text-align:center}
.poder>button{width:100%;font-size:12px}
.bts .sel{outline:2px solid var(--en)}
.bts.wrap{flex-wrap:wrap}.bts.wrap button{flex:1 1 45%;padding:7px 4px;font-size:12px}
.est0{background:rgba(39,174,96,.6)}.est1{background:rgba(241,196,15,.6)}.est2{background:rgba(192,57,43,.75);color:#fff}.est3{background:#000;color:#fff}
#vFoto{display:flex;flex-direction:column;gap:8px}
#extra{max-width:560px}
.poder{max-width:none;margin-top:6px}
.poder input,.poder textarea{width:100%;margin-bottom:4px;padding:4px}
.poder textarea{min-height:60px}
#lore{width:100%;min-height:200px}
.grade{display:grid;gap:4px;margin-top:6px}
.cel{width:64px;height:64px;border:1px dashed var(--bd);border-radius:6px;background:var(--sf);display:flex;align-items:center;justify-content:center;color:var(--mut);cursor:pointer;position:relative;overflow:hidden}
.cel img{width:100%;height:100%;object-fit:cover}
.cel .x{position:absolute;top:1px;right:1px;padding:0 4px;font-size:10px}
.p{stroke:var(--tx);stroke-width:1.5;fill:none;cursor:pointer}.p:hover{stroke-width:3}
.p.s0{fill:rgba(39,174,96,.6)}.p.s1{fill:rgba(241,196,15,.6)}.p.s2{fill:rgba(192,57,43,.75)}.p.s3{fill:#000}.p.sel{stroke:var(--en);stroke-width:3.5}
#corpoSvg{width:100%;max-height:340px}
#corpoLista{font-size:13px;margin:6px 0}.l1{color:#d4a017}.l2{color:#e74c3c}.l3{color:#000;background:#ddd;padding:0 4px;border-radius:3px;display:inline-block}
@media(max-width:700px){main{flex-direction:column;overflow-y:auto}.lado{width:auto;border-left:none;border-top:3px solid var(--bd)}}
</style>
</head>
<body>
<div id="topo">
  <div id="abas"></div>
  <button class="acao" id="add">+ Adicionar</button>
  <button class="acao" id="rem">− Remover</button>
</div>
<div id="aviso" hidden></div>
<main id="main"><p id="vazio">Carregando…</p></main>

<div id="cfg">
  <div class="caixa">
    <h3>⚙️ Valores de dano e cura</h3>
    <div id="cfgCampos"></div>
    <button id="fechar" style="margin-top:10px;width:100%">Fechar</button>
  </div>
</div>

<script>

/* ===== Banco de dados local (substitui o banco compartilhado do claude.ai) ===== */
const SEED = {"telas/tmw2rkvcugtb": {"corpo": {}, "criado": 1793835900606, "cura": {"G": 50, "GL": 75, "M": 25, "P": 10}, "dano": {"G": 50, "GL": 75, "M": 25, "P": 10}, "danoCorpo": {"1": 5, "2": 15, "3": 30}, "enAtual": 100, "enMax": 100, "lootC": 5, "lootL": 5, "lore": "", "nome": "Personagem 1", "poderes": [{"d": "", "n": "", "v": ""}], "pvAtual": 100, "pvMax": 100}, "config/geral": {"cura": {"G": 50, "GL": 75, "M": 25, "P": 10}, "dano": {"G": 50, "GL": 75, "M": 25, "P": 10}, "danoCorpo": {"1": 1, "2": 5, "3": 10}}};
(function(){
  const KEY = "fichas-rpg-db-v1";
  let store = null;
  try { store = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (!store) store = JSON.parse(JSON.stringify(SEED));
  const subs = new Set();
  const clone = o => JSON.parse(JSON.stringify(o));
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
  const notify = () => subs.forEach(f => f());
  const isObj = v => v && typeof v === "object" && !Array.isArray(v);
  function merge(a, b){ for (const k in b) a[k] = isObj(b[k]) ? merge(isObj(a[k]) ? a[k] : {}, b[k]) : b[k]; return a; }
  const meta = {fromCache:false, hasPendingWrites:false};
  const snapDoc = (id, d) => ({id, exists:d !== undefined, data:() => d === undefined ? undefined : clone(d), metadata:meta});
  function inscrever(calc, entregar){
    let ultimo = "\0";
    const f = () => { const v = calc(), s = JSON.stringify(v); if (s === ultimo) return; ultimo = s; entregar(v); };
    subs.add(f); setTimeout(f, 0);
    return () => subs.delete(f);
  }
  function docRef(path){
    const id = path.split("/").pop();
    return {id, path,
      get: async () => snapDoc(id, store[path]),
      set: async d => { store[path] = clone(d); save(); notify(); },
      update: async d => { if (!store[path]) throw {code:"invalid_argument"}; merge(store[path], clone(d)); save(); notify(); },
      delete: async () => { delete store[path]; save(); notify(); },
      onSnapshot: next => inscrever(() => store[path], v => next(snapDoc(id, v === undefined ? undefined : clone(v))))
    };
  }
  function colRef(col, filtros = [], ord = null){
    const n = col.split("/").length + 1;
    const linhas = () => {
      let r = Object.keys(store).filter(p => p.startsWith(col + "/") && p.split("/").length === n)
        .map(p => [p.split("/").pop(), store[p]])
        .filter(([, d]) => filtros.every(([f, op, v]) => op === "==" ? d[f] === v : true));
      if (ord) r.sort((a, b) => (a[1][ord[0]] > b[1][ord[0]] ? 1 : -1) * (ord[1] === "desc" ? -1 : 1));
      return r;
    };
    return {
      where: (f, op, v) => colRef(col, [...filtros, [f, op, v]], ord),
      orderBy: (f, dir) => colRef(col, filtros, [f, dir]),
      doc: id => docRef(col + "/" + (id || "d" + Date.now().toString(36))),
      onSnapshot: next => inscrever(linhas, rows => next({docs:rows.map(([id, d]) => snapDoc(id, clone(d))), size:rows.length, empty:!rows.length, metadata:meta}))
    };
  }
  const DB = {doc: docRef, collection: p => colRef(p)};
  window.addEventListener("storage", e => { if (e.key === KEY) { try { store = JSON.parse(e.newValue || "{}"); notify(); } catch (x) {} } });
  window.claude = window.claude || {use: async n => n === "db" ? DB : null};
})();
/* ===== Fim do banco local ===== */
const $ = s => document.querySelector(s);
const TIPOS = ["P","M","G","GL"];
const PAD = {nome:"",pvAtual:100,pvMax:100,enAtual:100,enMax:100,
  dano:{P:10,M:25,G:50,GL:75},cura:{P:10,M:25,G:50,GL:75},lore:"",poderes:[{n:"",v:"",d:""}],lootL:5,lootC:5,corpo:{},danoCorpo:{1:5,2:15,3:30}};
let db, telas = [], ativa = null, montada = null, modo = null, unsubImg = null;
let vista = "foto", lootImgs = {}, lootCel = null, unsubLoot = null, parteSel = null;
let brutas = [], cfg = {dano:PAD.dano, cura:PAD.cura, danoCorpo:PAD.danoCorpo};
function refazer(){ telas = brutas.map(t => ({...t, dano:cfg.dano, cura:cfg.cura, danoCorpo:cfg.danoCorpo})); render(); }
let fila = Promise.resolve(), timers = {}, confirma = 0;

function aviso(m){ const a=$("#aviso"); a.textContent=m; a.hidden=false; }
function atual(){ return telas.find(t => t.id === ativa); }
function salvar(id, dados){
  fila = fila.then(() => db.doc("telas/"+id).update(dados))
    .catch(e => aviso("Não foi possível salvar ("+(e.code||"erro")+"). Você precisa de acesso de Contribuidor ou superior."));
}
function deb(k, fn){ clearTimeout(timers[k]); timers[k] = setTimeout(fn, 500); }
const num = v => Math.max(0, Math.floor(Number(v)) || 0);

/* ---------- abas ---------- */
function desenharAbas(){
  const c = $("#abas"); c.innerHTML = "";
  telas.forEach(t => {
    const b = document.createElement("button");
    b.className = "aba" + (t.id === ativa ? " on" : "");
    b.textContent = t.nome || "Sem nome";
    b.onclick = () => { ativa = t.id; render(); };
    c.appendChild(b);
  });
}
$("#add").onclick = () => {
  if (!db) return;
  const id = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  ativa = id;
  fila = fila.then(() => db.doc("telas/"+id).set({...PAD, nome:"Personagem "+(telas.length+1), criado:Date.now()}))
    .catch(e => aviso("Não foi possível criar a tela ("+(e.code||"erro")+")."));
};
$("#rem").onclick = () => {
  if (!db || !ativa) return;
  const b = $("#rem");
  if (!confirma) { confirma = 1; b.textContent = "Confirmar remoção?"; setTimeout(()=>{confirma=0;b.textContent="− Remover";},3000); return; }
  confirma = 0; b.textContent = "− Remover";
  const id = ativa; ativa = null;
  Object.keys(lootImgs).forEach(k => db.doc("loot/"+id+"_"+k).delete().catch(()=>{}));
  fila = fila.then(() => db.doc("telas/"+id).delete()).then(() => db.doc("imagens/"+id).delete()).catch(()=>aviso("Não foi possível remover."));
};

/* ---------- painel ---------- */
function barra(k, titulo){
  return `<div class="bloco ${k}"><strong>${titulo}</strong>
    <div class="lin"><label>Máx <input type="number" min="1" id="${k}Max"></label>
      <div class="barra"><div class="exc" id="${k}Exc">${k==="pv"?"Morto":"!"}</div><div class="fill" id="${k}Fill"></div><div class="txt" id="${k}Txt"></div></div>
      <button data-reset="${k}" title="Recuperar tudo">↺</button></div>
    ${k==="pv" ? `<div class="bts">${TIPOS.map(t=>`<button class="dano" data-k="${k}" data-op="dano" data-t="${t}"></button>`).join("")}</div>` : ""}
    <div class="bts">${TIPOS.map(t=>`<button class="cura" data-k="${k}" data-op="cura" data-t="${t}"></button>`).join("")}</div>
  </div>`;
}
function montar(t){
  const id = t.id; montada = id; modo = null; parteSel = null;
  $("#main").innerHTML = `
  <section class="ficha">
    <div class="cab"><input class="nome" id="nome" placeholder="Nome"><button id="eng" title="Configurar valores">⚙️</button></div>
    <div class="par">${barra("pv","HP ❤️")}${barra("en","ENERGIA ⚡")}</div>
    <div class="dois" style="max-width:340px"><button data-ex="poder">Poder</button><button data-ex="loot">Loot</button><button data-ex="lore">Lore</button></div>
    <div id="extra"></div>
  </section>
  <aside class="lado">
    <div class="dois"><button data-v="foto">Foto</button><button data-v="corpo">Corpo</button></div>
    <div id="vFoto">
      <div class="img"><img id="foto" alt="" hidden><span id="semfoto">Sem imagem</span></div>
      <label><button type="button" style="width:100%" onclick="this.nextElementSibling.click()">Escolher imagem do computador</button><input type="file" accept="image/*" id="arq" hidden></label>
    </div>
    <div id="vCorpo" hidden>
      <div class="lin"><strong>Corpo</strong><button data-resetc="1" title="Restaurar todas as partes">↺</button><button data-engc="1" title="HP perdido por dano no corpo">⚙️</button></div>
      <svg id="corpoSvg" viewBox="0 0 120 255">${PARTES.map(([i,l,t,a]) => `<${t} class="p s0" data-p="${i}" ${a}><title>${l}</title></${t}>`).join("")}</svg>
      <div id="corpoSel"></div><div id="corpoLista"></div>
    </div>
    <input type="file" accept="image/*" id="lootArq" hidden>
  </aside>`;
  $("#nome").oninput = e => deb("nome", () => salvar(id, {nome:e.target.value}));
  $("#eng").onclick = abrirCfg;
  for (const k of ["pv","en"]) $("#"+k+"Max").onchange = e => {
    const m = Math.max(1, num(e.target.value)); const c = atual();
    salvar(id, {[k+"Max"]:m, [k+"Atual"]:Math.min(c[k+"Atual"], m)});
  };
  $("#main").onclick = e => {
    const p = e.target.closest("[data-p]");
    if (p) { parteSel = p.dataset.p; atualizarCorpo(atual()); return; }
    const b = e.target.closest("button");
    if (b && b.dataset.lx) { db.doc("loot/"+id+"_"+b.dataset.lx).delete(); return; }
    const cel = e.target.closest(".cel");
    if (!b && cel) { lootCel = cel.dataset.r+"_"+cel.dataset.c; $("#lootArq").click(); return; }
    if (!b) return;
    const d = b.dataset;
    if (d.reset) salvar(id,{[d.reset+"Atual"]:atual()[d.reset+"Max"]});
    else if (d.op) aplicar(d.k, d.op, d.t);
    else if (d.ex) abrirExtra(d.ex);
    else if (d.v) { vista = d.v; mostrarVista(); }
    else if (d.pa) mudarPoderes(+d.pa, b);
    else if (d.us) usarSkill(b);
    else if (d.resetc) {
      const t = atual(), zero = Object.fromEntries(PARTES.map(([i]) => [i, 0]));
      const volta = Object.values(t.drenos || {}).reduce((a, v) => a + (+v || 0), 0);
      salvar(id, {corpo:zero, drenos:zero, pvAtual:Math.min(t.pvMax, t.pvAtual + volta)});
    }
    else if (d.engc) abrirCfgCorpo();
    else if (d.cs && parteSel) {
      const t = atual(), raw = t.corpo || {}, dr = t.drenos || {}, n = +d.cs, o = {[parteSel]:n}, up = {};
      const dc = {...PAD.danoCorpo, ...(t.danoCorpo || {})};
      const custo = Math.max(0, (dc[n] || 0) - (dc[efetivo(raw, parteSel)] || 0));
      if (n === 3) descendentes(parteSel).forEach(i => o[i] = 3);
      up.corpo = o;
      if (n === 0) {
        const volta = dr[parteSel] || 0;
        if (volta) { up.pvAtual = Math.min(t.pvMax, t.pvAtual + volta); up.drenos = {[parteSel]:0}; }
      } else {
        const antes = t.pvAtual, morte = n === 3 && parteSel === "cabeca" && efetivo(raw, "cabeca") !== 3;
        const depois = morte ? 0 : Math.max(0, antes - custo);
        if (depois !== antes) { up.pvAtual = depois; up.drenos = {[parteSel]:(dr[parteSel] || 0) + (antes - depois)}; }
      }
      salvar(id, up);
    }
    else if (d.lg) mudarGrade(d.lg);
  };
  $("#main").oninput = e => {
    if (e.target.closest("#pLista")) {
      if (e.target.dataset.f === "v") e.target.value = e.target.value.replace(/\D/g, "");
      const arr = lerPoderes(); deb("pod", () => salvar(id, {poderes:arr}));
    }
    else if (e.target.id === "lore") { const v = e.target.value; deb("lore", () => salvar(id, {lore:v})); }
  };
  $("#lootArq").onchange = e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f || !lootCel) return; const k = lootCel;
    reduzir(f, 140, src => { const [r,c] = k.split("_"); db.doc("loot/"+id+"_"+k).set({tela:id, r:+r, c:+c, src}).catch(()=>aviso("Não foi possível salvar a imagem.")); });
  };
  $("#arq").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const s = Math.min(1, 520/Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      db.doc("imagens/"+id).set({src:c.toDataURL("image/jpeg",.8)}).catch(()=>aviso("Não foi possível salvar a imagem."));
    }; im.src = r.result; };
    r.readAsDataURL(f);
  };
  if (unsubImg) unsubImg();
  unsubImg = db.doc("imagens/"+id).onSnapshot(s => {
    const ok = s.exists && s.data().src, f = $("#foto"); if (!f) return;
    f.src = ok ? s.data().src : FOTO_PADRAO; f.hidden = false; $("#semfoto").hidden = true;
  });
  lootImgs = {}; if (unsubLoot) unsubLoot();
  unsubLoot = db.collection("loot").where("tela","==",id).onSnapshot(s => {
    lootImgs = {}; s.docs.forEach(d => { const x = d.data(); lootImgs[x.r+"_"+x.c] = x.src; });
    if (modo === "loot") pintarLoot();
  });
  mostrarVista();
}
const R = (x,y,w,h,r=5) => `x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"`;
const ESTADOS = ["Saudável","Dano leve","Ferimento grave","Perdido"];
const PAI = {anteD:"bracoD",maoD:"anteD",anteE:"bracoE",maoE:"anteE",canD:"coxaD",peD:"canD",canE:"coxaE",peE:"canE"};
const descendentes = p => Object.keys(PAI).filter(i => { for (let a = PAI[i]; a; a = PAI[a]) if (a === p) return true; return false; });

function reduzir(f, max, cb){
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const s = Math.min(1, max/Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height); cb(c.toDataURL("image/jpeg",.8));
  }; im.src = r.result; };
  r.readAsDataURL(f);
}

function lerPoderes(){

function mudarPoderes(d, btn){
  const l = lerPoderes();
  if (d < 0) {
    if (l.length <= 1) return;
    if (!btn.dataset.conf) {
      btn.dataset.conf = "1"; btn.textContent = "Confirmar remoção?";
      btn._t = setTimeout(() => { delete btn.dataset.conf; btn.textContent = "− Habilidade"; }, 3000);

    }

function usarSkill(b){

  if (t.enAtual < custo) { aviso("Energia insuficiente (" + t.enAtual + " disponível, custo " + custo + ")."); setTimeout(() => $("#aviso").hidden = true, 2500); return; }

}
function pintarLoot(){
  const t = atual(), L = Math.max(5, t.lootL || 5), C = Math.max(5, t.lootC || 5), g = $("#grade"); if (!g) return;
  if (g.dataset.s !== L+"x"+C) {
    g.dataset.s = L+"x"+C; g.style.gridTemplateColumns = `repeat(${C},64px)`;
    g.innerHTML = Array.from({length:L*C}, (_,i) => `<div class="cel" data-r="${Math.floor(i/C)}" data-c="${i%C}"></div>`).join("");
  }
  g.querySelectorAll(".cel").forEach(c => {
    const k = c.dataset.r+"_"+c.dataset.c, s = lootImgs[k];
    c.innerHTML = s ? `<img src="${s}" alt=""><button class="x" data-lx="${k}">✕</button>` : "+";
  });
}
function mudarGrade(a){
  const t = atual(); let L = Math.max(5, t.lootL || 5), C = Math.max(5, t.lootC || 5);
  if (a === "l+") L = Math.min(7, L+1); if (a === "l-") L = Math.max(5, L-1);
  if (a === "c+") C = Math.min(7, C+1); if (a === "c-") C = Math.max(5, C-1);
  Object.keys(lootImgs).forEach(k => { const [r,c] = k.split("_"); if (+r >= L || +c >= C) db.doc("loot/"+t.id+"_"+k).delete(); });
  salvar(t.id, {lootL:L, lootC:C});
}

function aplicar(k, op, tipo){

function atualizar(t){

  const novo = {dano:{...cfg.dano}, cura:{...cfg.cura}, danoCorpo:{...cfg.danoCorpo}};
  novo[i.dataset.cop][i.dataset.ct] = num(i.value);
  fila = fila.then(() => db.doc("config/geral").set(novo)).catch(() => aviso("Não foi possível salvar as configurações."));
};
$("#fechar").onclick = () => $("#cfg").style.display = "none";

/* ---------- render e sincronização ---------- */
function render(){
  if (!telas.find(t => t.id === ativa)) ativa = telas.length ? telas[0].id : null;
  desenharAbas();
  const t = atual();
  if (!t) { montada = null; $("#main").innerHTML = '<p id="vazio">Nenhuma tela. Clique em “+ Adicionar”.</p>'; return; }
  if (montada !== t.id) montar(t);
  atualizar(t);
}
(async () => {
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) { $("#vazio").textContent = "Sincronização indisponível. Abra o link publicado e entre na sua conta."; aviso("Sem acesso ao banco de dados compartilhado."); return; }
  const timer = setTimeout(() => aviso("Ainda não foi possível alcançar os dados."), 10000);
  db.collection("telas").orderBy("criado").onSnapshot(s => {
    if (!s.metadata.fromCache) { clearTimeout(timer); $("#aviso").hidden = true; }
    brutas = s.docs.map(d => ({...PAD, ...d.data(), id:d.id}));
    refazer();
  }, e => { clearTimeout(timer); aviso("Erro ao carregar ("+e.code+")."); });
  db.doc("config/geral").onSnapshot(s => {
    const c = s.exists ? s.data() : {};
    cfg = {dano:{...PAD.dano, ...(c.dano || {})}, cura:{...PAD.cura, ...(c.cura || {})}, danoCorpo:{...PAD.danoCorpo, ...(c.danoCorpo || {})}};
    refazer();
  });
})();
</script>
